spring:
  application:
    name: spring-ai-fundamentals
  reactor:
    context-propagation: auto
  ai:
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
    tools:
      observations:
        include-content: false
    vectorstore:
      observations:
        log-query-response: false
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3:latest}
        temperature: 0.4
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

app:
  ollama:
    response-timeout: ${OLLAMA_RESPONSE_TIMEOUT:5m}
  rag:
    top-k: 3
    similarity-threshold: 0.45
  tools:
    time-zone: ${APP_TIME_ZONE:Asia/Kolkata}

server:
  port: ${PORT:8080}

management:
  server:
    address: 127.0.0.1
    port: ${APP_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: 0.1
    propagation:
      type: w3c
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

logging:
  level:
    org.springframework.ai: INFO
