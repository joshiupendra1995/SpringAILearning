spring:
  application:
    name: spring-ai-fundamentals
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3:latest}
        temperature: 0.4
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

app:
  ollama:
    response-timeout: ${OLLAMA_RESPONSE_TIMEOUT:5m}
  rag:
    top-k: 3
    similarity-threshold: 0.45
  tools:
    time-zone: ${APP_TIME_ZONE:Asia/Kolkata}

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.ai: INFO
